name: AutoToggle
options:
  bundleIdPrefix: com.autotoggle
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 leogottadothebest. All rights reserved."

targets:
  AutoToggle:
    type: application
    platform: macOS
    sources:
      - path: AutoToggle
    settings:
      base:
        INFOPLIST_FILE: AutoToggle/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.autotoggle.app
        GENERATE_INFOPLIST_FILE: false
        # ad-hoc 签名（无需开发者账号），但保留 Hardened Runtime 与最小化授权
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AutoToggle/AutoToggle.entitlements
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
      configs:
        Release:
          # ad-hoc 签名默认会注入 get-task-allow 调试授权（允许任意进程附加调试/注入代码）。
          # 发布构建必须关闭注入，仅保留我们声明的 apple-events 授权。
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies: []
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
        inputFiles: []
        outputFiles: []

  AutoToggleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AutoToggleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.autotoggle.app.tests
    dependencies:
      - target: AutoToggle

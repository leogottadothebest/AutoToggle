name: Bug 报告
description: 报告 AutoToggle 的一个 bug
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: AutoToggle 版本
      description: 见「设置 → 关于」（如 1.3.0）
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: "如 15.5"
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: 是否已授予「辅助功能」权限
      options:
        - 已授予
        - 未授予
        - 不清楚
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期应该是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 观察到 …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断报告（可选但强烈建议）
      description: 使用「日志 → 导出诊断」生成报告，把内容粘贴到这里或作为附件上传。
